method: random
count: 100

metric:
  name: val_accuracy
  goal: maximize

parameters:
  learning_rate:
    values: [0.0001, 0.001, 0.01]

  optimizer:
    values: ["sgd", "momentum", "nag", "rmsprop", "adam", "nadam"]

  activation:
    values: ["relu", "tanh", "sigmoid"]

  hidden_layers:
    values:
      - "128,64"
      - "128,128,128"

program: src/train.py